<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root { --bg:#05070f; --fg:#f0e9d9; --gold:#c5a26f; }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); font-family:"Inter",sans-serif; }
    .grain { position:absolute; inset:0; z-index:50; pointer-events:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22256%22 height=%22256%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.85%22/></filter><rect width=%22256%22 height=%22256%22 filter=%22url(%23n)%22 opacity=%220.03%22/></svg>'); background-size:256px; mix-blend-mode:screen; }
    .center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:10; width:88%; }
    .title { font-family:"Playfair Display",serif; font-size:52px; color:var(--fg); line-height:0.94; font-weight:700; }
    .wave { position:absolute; bottom:25%; left:10%; right:10%; height:4px; background:linear-gradient(90deg, transparent, var(--gold), transparent); z-index:5; }
    .sub { font-size:20px; color:#a8a39a; margin-top:12px; }
    .cta { position:absolute; bottom:8%; left:0; right:0; text-align:center; font-size:17px; color:var(--gold); letter-spacing:2px; z-index:20; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="soundtrack" data-start="0" data-duration="35" data-width="1080" data-height="1920">
    <div class="grain"></div>
    <div class="center">
      <div style="font-size:15px; color:#a8a39a; letter-spacing:3px; margin-bottom:4px;">THE VOICE OF YOUR WORLD</div>
      <div class="title">Your world<br>has a<br>soundtrack.</div>
      <div class="sub">One sentence. Full original score.<br>Synced to your canon.</div>
    </div>
    <div class="wave" id="musicwave"></div>
    <div class="cta">Build the voice of your world • arcanea.ai</div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    window.__timelines = { "soundtrack": tl };

    function build(){
      tl.from(".title", {y:18, opacity:0, duration:1.3, ease:"power3.out"}, 0.6);
      tl.from(".sub", {y:12, opacity:0, duration:1.0, ease:"power2.out"}, 1.8);
      tl.to("#musicwave", {scaleX:1.4, opacity:0.6, duration:1.5, ease:"sine.inOut", repeat:4, yoyo:true}, 4);
      tl.to("#musicwave", {opacity:0.3, duration:8, ease:"sine.inOut"}, 8);
    }
    function init(){ build(); }
    if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init); else init();
  </script>
</body>
</html>
